<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — REALI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/web/assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/reali.css">
<style>
/* /panel es una página oscura: anula el override claro global del sitio público */
body{background:var(--midnight);color:var(--bone)}
</style>
</head>
<body>

<!-- GATE DE ACCESO -->
<div class="gate-wrap" id="gate">
  <form class="gate-card" id="gate-form">
    <img class="gate-logo" src="/web/assets/wordmark-bone-light.png" alt="REALI">
    <div class="gate-sub">Panel personal · Acceso restringido</div>
    <label for="gate-input">Clave de acceso</label>
    <input id="gate-input" type="password" autocomplete="current-password" autofocus>
    <div class="gate-error" id="gate-error">Clave incorrecta</div>
    <button type="submit" class="btn btn-primary">Entrar</button>
    <div class="gate-foot">Uso exclusivo del administrador</div>
  </form>
</div>

<!-- PANEL (visible tras el gate) -->
<div class="panel-shell" id="panel">
  <header>
    <img src="/web/assets/wordmark-bone-light.png" alt="REALI" style="height:22px">
    <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--bone-muted)">Panel personal</span>
  </header>
  <div class="panel-empty">
    <div style="font-size:44px">📊</div>
    <h1>Panel en construcción</h1>
    <p>Aquí vivirá el dashboard personal de trading (BOB): estado de las grillas, P&amp;L y posiciones, consultable desde cualquier dispositivo.</p>
  </div>
</div>

<script>
// Gate client-side por hash: la clave nunca aparece en el código fuente,
// solo su SHA-256. Suficiente mientras el panel no exponga datos sensibles;
// al conectar datos reales de trading se reemplaza por auth de verdad.
//
// TODO(human): pegar aquí el hash SHA-256 (hex, 64 caracteres) de tu clave.
// Genéralo en la consola del navegador (F12) con:
//   crypto.subtle.digest('SHA-256', new TextEncoder().encode('TU_CLAVE'))
//     .then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('')))
const HASH_CLAVE = 'cc1f9e8f7a35add5905a920e58d45fd598cc9fdd531d510d564147f153ba69cd';

const gate = document.getElementById('gate');
const panel = document.getElementById('panel');
const form = document.getElementById('gate-form');
const input = document.getElementById('gate-input');
const errorMsg = document.getElementById('gate-error');

function abrirPanel() {
  gate.style.display = 'none';
  panel.style.display = 'flex';
}

if (sessionStorage.getItem('panel_ok') === '1') abrirPanel();

async function sha256hex(texto) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const hash = await sha256hex(input.value);
  if (hash === HASH_CLAVE) {
    sessionStorage.setItem('panel_ok', '1');
    abrirPanel();
  } else {
    input.value = '';
    input.classList.add('error');
    errorMsg.style.display = 'block';
  }
});

input.addEventListener('input', () => {
  input.classList.remove('error');
  errorMsg.style.display = 'none';
});
</script>

</body>
</html>
